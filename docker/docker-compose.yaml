name: nest-rest-backend-template

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else redis-server --appendonly yes; fi',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-19000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/$${S3_BUCKET:-app-files} &&
        mc version enable local/$${S3_BUCKET:-app-files}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-app-files}
    restart: 'no'
    networks: [backend]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  auth-service:
    build:
      context: ..
      dockerfile: docker/auth-service.Dockerfile
    restart: unless-stopped
    # Caps this service's own CPU quota so an Argon2 surge here can't starve sibling
    # containers for host CPU time (relevant on a single shared Docker host/VM; in a real
    # multi-node cluster this is naturally enforced by scheduling auth-service on its own
    # nodes). Must be <= the host's actual core count, or Docker refuses to start the
    # container at all — override via AUTH_SERVICE_CPU_LIMIT in docker/.env per host.
    cpus: ${AUTH_SERVICE_CPU_LIMIT:-4.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONFIG_FILE: /app/config.yaml
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_ACCESS_TOKEN: ${JWT_ACCESS_TOKEN:?JWT_ACCESS_TOKEN is required}
      JWT_REFRESH_TOKEN: ${JWT_REFRESH_TOKEN:?JWT_REFRESH_TOKEN is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-app-files}
      ZABBIX_ENABLED: ${ZABBIX_ENABLED:-false}
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    expose:
      - '50051'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(50051,'localhost').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      CONFIG_FILE: /app/config.yaml
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_ACCESS_TOKEN: ${JWT_ACCESS_TOKEN:?JWT_ACCESS_TOKEN is required}
      JWT_REFRESH_TOKEN: ${JWT_REFRESH_TOKEN:?JWT_REFRESH_TOKEN is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-app-files}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      BACKEND_LOG_FILE_PATH: ${BACKEND_LOG_FILE_PATH:-/app/logs/backend.log}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      ZABBIX_ENABLED: ${ZABBIX_ENABLED:-false}
      COMMENTS_AUTO_APPROVE: ${COMMENTS_AUTO_APPROVE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      CSRF_ENABLED: ${CSRF_ENABLED:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      AUTH_SERVICE_GRPC_URL: auth-service:50051
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - ./logs:/app/logs
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-to-server only — the browser never calls the backend directly,
      # see docs/planning/04-frontend-architecture.md §3.
      INTERNAL_API_BASE_URL: http://backend:3000
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]
